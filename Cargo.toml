[workspace]
resolver = "3"
members = ["crates/proto", "crates/platform", "crates/core", "crates/app"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.85"

[workspace.dependencies]
dextr-proto = { path = "crates/proto" }
dextr-platform = { path = "crates/platform" }
dextr-core = { path = "crates/core" }

anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
futures = "0.3"
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.14"
sha2 = "0.10"
hex = "0.4"
directories = "6"
toml = "0.9"
ashpd = { version = "0.14", default-features = false, features = ["tokio"] }
reis = { version = "0.7", features = ["tokio"] }
iced = { version = "0.14", features = ["tokio", "canvas"] }

[profile.release]
lto = "thin"
codegen-units = 1
