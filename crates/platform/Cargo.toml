[package]
name = "dextr-platform"
description = "OS backends: input capture and input injection"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
dextr-proto.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
futures.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { workspace = true, features = ["input_capture", "remote_desktop", "screencast"] }
reis.workspace = true
rustix = { version = "1", features = ["time"] }
libloading = "0.8"
zbus = { version = "6", default-features = false, features = ["tokio", "service", "proxy"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-screen-capture-kit = "0.3"
objc2-core-media = "0.3"
objc2-core-video = "0.3"
block2 = "0.6"
